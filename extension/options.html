<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>简译 · 设置</title><link rel="stylesheet" href="ui.css"><main><h1>简译</h1><p>连接你的模型，让阅读回到内容本身。</p><form id="form"><section><h2>模型连接</h2><label>Base URL<input name="baseUrl" type="url" required placeholder="https://your-provider.com/v1"></label><small>支持 OpenAI 兼容的 Chat Completions，可填写接口前缀或完整地址。</small><label>模型名<input name="model" required placeholder="填写服务商提供的准确模型 ID"></label><label>API Key<input name="apiKey" type="password" autocomplete="off" placeholder="本地模型可留空"></label><small>密钥仅保存在本机插件存储中，不做云同步。翻译文本直接发送给你配置的服务。</small></section><section><h2>翻译</h2><label>目标语言<input name="target" required></label><label>翻译 Prompt<textarea name="prompt" required></textarea></label><small>{{target}} 会替换为目标语言。</small><details><summary>推理与请求参数</summary><p>留空的可选参数不会发送，避免不同模型间的兼容错误。</p><div class="grid"><label>Temperature（可选）<input name="temperature" type="number" min="0" max="2" step="0.1" placeholder="服务默认"></label><label>Top P（可选）<input name="topP" type="number" min="0" max="1" step="0.05" placeholder="服务默认"></label><label>输出 token 上限（可选）<input name="maxTokens" type="number" min="1" max="131072" placeholder="服务默认"></label><label>推理强度（可选）<select name="reasoningEffort"><option value="">服务默认</option><option>none</option><option>minimal</option><option>low</option><option>medium</option><option>high</option></select></label><label>超时 / 秒<input name="timeout" type="number" min="5" max="300" required></label><label>并发请求<input name="concurrency" type="number" min="1" max="4" required></label></div><label>额外请求参数（JSON）<textarea name="extra" spellcheck="false"></textarea></label><small>例如 {"enable_thinking": false}；具体字段取决于服务商。使用 max_completion_tokens 时请清空上面的输出 token 上限。</small></details></section><div class="actions"><button type="submit">保存设置</button><button type="button" class="secondary" id="test">保存并测试连接</button></div><p id="status" role="status" aria-live="polite"></p></form></main><script src="options.js" type="module"></script></html>
