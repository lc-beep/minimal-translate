<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>简译 · 设置</title><link rel="stylesheet" href="ui.css">
<main class="setup">
<header><h1>连接你的模型</h1><p>填写三项连接信息，测试成功后就可以开始双语阅读。</p></header>
<form id="form">
<fieldset id="connection-fields">
<label>接口地址（Base URL）<input name="baseUrl" type="url" required placeholder="https://your-provider.com/v1" spellcheck="false" autocomplete="off"></label>
<small>从模型服务商获取，支持 OpenAI 兼容的 Chat Completions 接口。</small>
<label>模型名<input name="model" required placeholder="服务商提供的模型 ID" spellcheck="false" autocomplete="off"></label>
<label>API Key<input name="apiKey" type="password" autocomplete="off" placeholder="粘贴密钥；无鉴权的本地服务可留空"></label>
<small>密钥仅保存在本机；翻译文本直接发送到你的模型服务。</small>
<div class="actions setup-actions"><button type="button" id="test">保存并测试连接</button><button type="submit" class="secondary">仅保存</button></div>
<div id="feedback" aria-live="polite"><p id="status" role="status"></p><p id="sample" hidden></p></div>
<div id="next-step" hidden><button id="return" type="button">返回网页，开始阅读</button><p id="next-hint">返回后点击浏览器工具栏中的简译，选择「翻译此页」。</p></div>
<details class="advanced"><summary>翻译偏好与高级参数</summary>
<label>目标语言<input name="target" required></label>
<label>翻译 Prompt<textarea name="prompt" required></textarea></label><small>{{target}} 会替换成目标语言。无需调整也可以直接使用。</small>
<p>以下可选参数留空时使用服务默认值。</p>
<div class="grid">
<label>Temperature<input name="temperature" type="number" min="0" max="2" step="0.1" placeholder="服务默认"></label>
<label>Top P<input name="topP" type="number" min="0" max="1" step="0.05" placeholder="服务默认"></label>
<label>输出 token 上限<input name="maxTokens" type="number" min="1" max="131072" placeholder="服务默认"></label>
<label>推理强度<select name="reasoningEffort"><option value="">服务默认</option><option>none</option><option>minimal</option><option>low</option><option>medium</option><option>high</option></select></label>
<label>超时 / 秒<input name="timeout" type="number" min="5" max="300" required></label>
<label>并发请求<input name="concurrency" type="number" min="1" max="4" required></label>
</div>
<label>额外请求参数（JSON）<textarea name="extra" spellcheck="false"></textarea></label>
<small>例如 {"enable_thinking": false}，具体取决于服务商。使用 max_completion_tokens 时请清空输出 token 上限。</small>
</details>
</fieldset>
</form>

</main><script src="options.js" type="module"></script></html>
